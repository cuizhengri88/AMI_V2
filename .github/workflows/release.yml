name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      UPDATER_PUBLIC_BASE_URL: ${{ secrets.UPDATER_PUBLIC_BASE_URL }}
      UPDATER_SSH_HOST: ${{ secrets.UPDATER_SSH_HOST }}
      UPDATER_SSH_PORT: ${{ secrets.UPDATER_SSH_PORT }}
      UPDATER_SSH_USER: ${{ secrets.UPDATER_SSH_USER }}
      UPDATER_REMOTE_DIR: ${{ secrets.UPDATER_REMOTE_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install dependencies
        run: npm install

      - name: build tauri app
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_DB_HOST: ${{ secrets.VITE_DB_HOST }}
          VITE_DB_PORT: ${{ secrets.VITE_DB_PORT }}
          VITE_DB_NAME: ${{ secrets.VITE_DB_NAME }}
          VITE_DB_USER: ${{ secrets.VITE_DB_USER }}
          VITE_DB_PASSWORD: ${{ secrets.VITE_DB_PASSWORD }}
          VITE_DB_SCHEMA: ${{ secrets.VITE_DB_SCHEMA }}
        with:
          # v__VERSION__ 대신 실제 푸시된 태그 이름을 사용하여 혼선을 방지합니다.
          tagName: ${{ github.ref_name }}
          releaseName: "AMI ${{ github.ref_name }}"
          releaseBody: "자동 업데이트 기능이 포함된 AMI 버전 ${{ github.ref_name }} 릴리스입니다."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          includeRelease: true

      - name: download updater assets from release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          $apiHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $apiHeaders
          if (-not $release -or -not $release.assets) {
            throw "No release assets found for tag $tag"
          }

          New-Item -ItemType Directory -Path "updater_upload" -Force | Out-Null

          $wantedAssets = $release.assets | Where-Object {
            $_.name -eq "latest.json" -or $_.name -match "\.msi$|\.exe$"
          }
          if (-not $wantedAssets -or $wantedAssets.Count -eq 0) {
            throw "Could not find latest.json / .msi / .exe assets in release $tag"
          }

          foreach ($asset in $wantedAssets) {
            $downloadHeaders = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/octet-stream"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $outFile = Join-Path "updater_upload" $asset.name
            Write-Host "Downloading $($asset.name)"
            Invoke-WebRequest -Uri $asset.url -Headers $downloadHeaders -OutFile $outFile
          }

          Get-ChildItem "updater_upload" -File | Select-Object -ExpandProperty Name

      - name: rewrite latest.json urls to public server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PUBLIC_BASE_URL)) {
            throw "Missing secret UPDATER_PUBLIC_BASE_URL (example: https://jpczr.dynv6.net)"
          }

          $latestPath = Join-Path "updater_upload" "latest.json"
          if (-not (Test-Path $latestPath)) {
            throw "latest.json not found in updater_upload directory"
          }

          $baseUrl = $env:UPDATER_PUBLIC_BASE_URL.TrimEnd("/")
          $latest = Get-Content -Raw $latestPath | ConvertFrom-Json

          foreach ($platform in $latest.platforms.PSObject.Properties) {
            $item = $platform.Value
            if (-not $item.url) { continue }

            $fileName = [System.IO.Path]::GetFileName(([Uri]$item.url).AbsolutePath)
            $localAssetPath = Join-Path "updater_upload" $fileName
            if (-not (Test-Path $localAssetPath)) {
              throw "Asset referenced by latest.json not downloaded: $fileName"
            }

            $item.url = "$baseUrl/$fileName"
          }

          $latest | ConvertTo-Json -Depth 20 | Set-Content -Path $latestPath -Encoding utf8NoBOM
          Get-Content -Raw $latestPath

      - name: upload updater files to public server
        shell: pwsh
        env:
          UPDATER_SSH_PRIVATE_KEY: ${{ secrets.UPDATER_SSH_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:UPDATER_SSH_HOST)) { throw "Missing secret UPDATER_SSH_HOST" }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_SSH_USER)) { throw "Missing secret UPDATER_SSH_USER" }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_REMOTE_DIR)) { throw "Missing secret UPDATER_REMOTE_DIR" }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_SSH_PRIVATE_KEY)) { throw "Missing secret UPDATER_SSH_PRIVATE_KEY" }

          $port = if ([string]::IsNullOrWhiteSpace($env:UPDATER_SSH_PORT)) { "22" } else { $env:UPDATER_SSH_PORT }
          $target = "$($env:UPDATER_SSH_USER)@$($env:UPDATER_SSH_HOST)"

          $keyPath = Join-Path $env:RUNNER_TEMP "updater_deploy_key"
          [System.IO.File]::WriteAllText($keyPath, ($env:UPDATER_SSH_PRIVATE_KEY.Trim() + "`n"))

          ssh -o StrictHostKeyChecking=no -i $keyPath -p $port $target "mkdir -p '$($env:UPDATER_REMOTE_DIR)'"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create remote directory" }

          $files = @(Get-ChildItem "updater_upload" -File | ForEach-Object { $_.FullName })
          if (-not $files -or $files.Count -eq 0) {
            throw "No files to upload from updater_upload"
          }

          & scp -o StrictHostKeyChecking=no -i $keyPath -P $port $files "$target:$($env:UPDATER_REMOTE_DIR)/"
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload updater files" }
