name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install dependencies
        run: npm install

      - name: build tauri app
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_DB_HOST: ${{ secrets.VITE_DB_HOST }}
          VITE_DB_PORT: ${{ secrets.VITE_DB_PORT }}
          VITE_DB_NAME: ${{ secrets.VITE_DB_NAME }}
          VITE_DB_USER: ${{ secrets.VITE_DB_USER }}
          VITE_DB_PASSWORD: ${{ secrets.VITE_DB_PASSWORD }}
          VITE_DB_SCHEMA: ${{ secrets.VITE_DB_SCHEMA }}
        with:
          # v__VERSION__ 대신 실제 푸시된 태그 이름을 사용하여 혼선을 방지합니다.
          tagName: ${{ github.ref_name }}
          releaseName: "AMI ${{ github.ref_name }}"
          releaseBody: "자동 업데이트 테스트 버전"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          includeRelease: true
          includeAssets: "src-tauri/target/release/bundle/msi/*.msi, src-tauri/target/release/bundle/msi/*.sig, src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/nsis/*.sig"