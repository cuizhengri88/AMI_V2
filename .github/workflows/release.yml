name: Release
on:
  push:
    tags:
      - 'v*' # v0.1.7 같은 태그를 푸시하면 실행됩니다.

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install dependencies
        run: npm install

      - name: build tauri app
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_DB_HOST: ${{ secrets.VITE_DB_HOST }}
          VITE_DB_PORT: ${{ secrets.VITE_DB_PORT }}
          VITE_DB_NAME: ${{ secrets.VITE_DB_NAME }}
          VITE_DB_USER: ${{ secrets.VITE_DB_USER }}
          VITE_DB_PASSWORD: ${{ secrets.VITE_DB_PASSWORD }}
          VITE_DB_SCHEMA: ${{ secrets.VITE_DB_SCHEMA }}
        with:
          tagName: v__VERSION__
          releaseName: "AMI v__VERSION__"
          releaseBody: "자동 업데이트 테스트 버전"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          includeRelease: true

      # [추가된 강제 업로드 단계] Tauri 액션이 놓친 .zip과 .sig 파일을 직접 찾아 올립니다.
      - name: Force upload updater assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Target Tag: $tag"

          # 1. MSI 폴더와 NSIS 폴더를 모두 뒤져서 .zip과 .sig 파일을 다 찾습니다.
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle/" -Include *.zip, *.sig -Recurse
          
          if ($files.Count -eq 0) {
            Write-Error "파일을 찾지 못했습니다. 빌드 경로가 다른 것 같습니다."
            exit 1
          }

          foreach ($file in $files) {
            # 이미 올라간 msi, exe 등은 제외하고 업데이트용(zip, sig)만 올립니다.
            if ($file.Extension -eq ".zip" -or $file.Extension -eq ".sig") {
              Write-Host "강제 업로드 중: $($file.FullName)"
              & gh release upload $tag $file.FullName --clobber
            }
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}