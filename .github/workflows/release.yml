name: Release
on:
  push:
    tags:
      - 'v*' # v0.1.7 같은 태그를 푸시하면 실행됩니다.

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install dependencies
        run: npm install

      - name: build tauri app
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_DB_HOST: ${{ secrets.VITE_DB_HOST }}
          VITE_DB_PORT: ${{ secrets.VITE_DB_PORT }}
          VITE_DB_NAME: ${{ secrets.VITE_DB_NAME }}
          VITE_DB_USER: ${{ secrets.VITE_DB_USER }}
          VITE_DB_PASSWORD: ${{ secrets.VITE_DB_PASSWORD }}
          VITE_DB_SCHEMA: ${{ secrets.VITE_DB_SCHEMA }}
        with:
          tagName: v__VERSION__
          releaseName: "AMI v__VERSION__"
          releaseBody: "자동 업데이트 테스트 버전"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          includeRelease: true

      # [추가된 강제 업로드 단계] Tauri 액션이 놓친 .zip과 .sig 파일을 직접 찾아 올립니다.
      - name: Force upload updater assets
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/**/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}